<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crazy Loader</title>
<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .loader {
        position: relative;
        width: 150px;
        height: 150px;
    }

    .loader span {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 6px solid transparent;
        animation: spin 1.2s linear infinite;
    }

    .loader span:nth-child(1) {
        border-top: 6px solid red;
        animation-delay: 0s;
    }

    .loader span:nth-child(2) {
        border-right: 6px solid yellow;
        animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
        border-bottom: 6px solid lime;
        animation-delay: 0.4s;
    }

    .loader span:nth-child(4) {
        border-left: 6px solid cyan;
        animation-delay: 0.6s;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg) scale(1);
            filter: hue-rotate(0deg);
        }
        50% {
            transform: rotate(180deg) scale(1.3);
        }
        100% {
            transform: rotate(360deg) scale(1);
            filter: hue-rotate(360deg);
        }
    }

    .text {
        position: absolute;
        color: white;
        font-size: 18px;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>
</head>
<body>

<div class="loader">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="text">Loading Brain Cells...</div>

</body>
</html>
